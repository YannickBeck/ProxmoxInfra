---
# =======================================================================
# Paperless-ngx — Docker Compose
# =======================================================================
# Deploys Paperless-ngx with PostgreSQL (database) and Redis (task queue).
#
# Ports:
#   8000  — Paperless web UI
#
# Configuration is read from the .env file in the same directory.
# Copy .env.example → .env and fill in the required values.
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose pull
#   docker compose up -d
#   docker compose exec webserver createsuperuser   # if PAPERLESS_ADMIN_USER not set
# =======================================================================

services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:16
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PAPERLESS_DBNAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DBUSER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:-paperless}

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-web
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
