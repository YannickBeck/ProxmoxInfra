# =======================================================================
# ansible.cfg — ProxmoxInfra Lab Ansible Configuration
# =======================================================================
# This file configures Ansible behaviour for the ProxmoxInfra Windows lab.
# It is checked in to the repository; sensitive values (passwords, secrets)
# are kept exclusively in ansible/inventory/group_vars/all/vault.yml which
# is encrypted with ansible-vault and NOT committed.
#
# vault_password_file is OPTIONAL.  If you do not create ~/.vault_pass you
# will be prompted for the vault password each time you run a playbook:
#   ansible-playbook -i inventory/lab.yml playbooks/dc.yml --ask-vault-pass
#
# To use the password file:
#   echo 'yourpassword' > ~/.vault_pass && chmod 600 ~/.vault_pass
# =======================================================================

[defaults]
# Default inventory — override on the command line with -i if needed
inventory            = inventory/lab.yml

# Remote user — overridden per host/group in the inventory
remote_user          = Administrator

# Disable host-key checking so new VMs can be reached without prior SSH
# key acceptance (Windows WinRM is not affected by this setting)
host_key_checking    = False

# Connection timeout in seconds
timeout              = 60

# Human-friendly output format
stdout_callback      = yaml

# Suppress deprecation noise
deprecation_warnings = False

# Path to a file containing the ansible-vault password (one line, no newline).
# Create with:  echo 'yourpassword' > ~/.vault_pass && chmod 600 ~/.vault_pass
# Comment this line out if you prefer to be prompted each run.
vault_password_file  = ~/.vault_pass

# Do not write .retry files on failure
retry_files_enabled  = False

[winrm]
# Default WinRM transport; can be overridden per host or group in the inventory.
# Use 'kerberos' after domain join when Kerberos is available, 'ntlm' otherwise.
transport = ntlm

[ssh_connection]
# Enable pipelining to reduce the number of SSH connections for Linux hosts
pipelining  = True
ssh_args    = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
