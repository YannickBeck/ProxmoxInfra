---
# =======================================================================
# Active Directory Certificate Services (PKI) Playbook
# =======================================================================
# Configures lab-ca01 (VM 104, 10.10.10.30) as an Enterprise Root CA
# for lab.local, providing internal PKI for SCCM HTTPS / PKI mode, IIS,
# LDAPS on the DCs, web server certs, client authentication and code
# signing.
#
# Prerequisites:
#   - lab-dc01 is running and the lab.local domain is available
#   - Windows Server 2022 is installed on lab-ca01
#   - WinRM is enabled on lab-ca01 (run winrm quickconfig -y)
#   - Inventory lab.yml has a `ca` group with lab-ca01 credentials
#
# Usage:
#   ansible-playbook -i inventory/lab.yml playbooks/ca.yml
#
# IMPORTANT — MANUAL POST-STEPS:
#   This playbook installs and configures the Enterprise Root CA and the
#   Web Enrollment role only. Certificate-TEMPLATE configuration (duplicating
#   Workstation Authentication / Web Server / the ConfigMgr templates and
#   granting Domain Computers Enroll/Autoenroll) and the certificate
#   AUTO-ENROLLMENT GPO linked at the domain root are MANUAL steps performed
#   in certtmpl.msc / certsrv.msc and the Group Policy Management console.
#   See infrastructure/vms/ca/README.md and the `info` task output below.
# =======================================================================

- name: Configure Enterprise Root CA – lab-ca01
  hosts: ca
  gather_facts: false

  vars:
    # Domain join credential — defaults to the LAB Administrator. The
    # password is taken from the host's ansible_password unless you set
    # domain_admin_password explicitly in the inventory.
    domain_admin: "LAB\\Administrator"
    ca_common_name: "LAB-Root-CA"

  tasks:

    # -------------------------------------------------------------------
    # Connectivity check
    # -------------------------------------------------------------------
    - name: Wait for WinRM to be available
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5
      tags: [always]

    - name: Ping Windows host
      ansible.windows.win_ping:
      tags: [always]

    # -------------------------------------------------------------------
    # Tag: info — display current state
    # -------------------------------------------------------------------
    - name: Get current hostname
      ansible.windows.win_shell: $env:COMPUTERNAME
      register: current_hostname
      tags: [info]

    - name: Show current hostname
      ansible.builtin.debug:
        msg: "Current hostname: {{ current_hostname.stdout | trim }}"
      tags: [info]

    - name: Get domain membership
      ansible.windows.win_shell: (Get-WmiObject Win32_ComputerSystem).Domain
      register: current_domain
      tags: [info]

    - name: Show domain status
      ansible.builtin.debug:
        msg: "Current domain/workgroup: {{ current_domain.stdout | trim }}"
      tags: [info]

    # -------------------------------------------------------------------
    # Tag: rename — rename computer (reboot handled at the join step)
    # -------------------------------------------------------------------
    - name: Rename computer to LAB-CA01
      ansible.windows.win_hostname:
        name: LAB-CA01
      register: rename_result
      when: current_hostname.stdout | trim | upper != "LAB-CA01"
      tags: [rename]

    - name: Reboot if the rename requires it
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: rename_result.reboot_required | default(false)
      tags: [rename]

    # -------------------------------------------------------------------
    # Tag: network — set static IP, gateway and DNS on the vmbr1 adapter
    # -------------------------------------------------------------------
    - name: Configure static IP address
      ansible.windows.win_shell: |
        $adapter = Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | Select-Object -First 1
        $desired = "{{ lab_ca_ip | default('10.10.10.30') }}"
        $existing = Get-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                    Where-Object { $_.IPAddress -eq $desired }
        if (-not $existing) {
            Remove-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            Remove-NetRoute     -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            New-NetIPAddress -InterfaceAlias $adapter.Name `
                -IPAddress $desired `
                -PrefixLength 24 `
                -DefaultGateway "{{ lab_gateway | default('10.10.10.1') }}" | Out-Null
        }
        Set-DnsClientServerAddress -InterfaceAlias $adapter.Name `
            -ServerAddresses "{{ lab_dc_ip | default('10.10.10.10') }}"
      tags: [network]

    # -------------------------------------------------------------------
    # Tag: join — join the lab.local domain (placed in OU=Servers)
    # -------------------------------------------------------------------
    - name: Test DC connectivity before domain join
      ansible.windows.win_shell: |
        Test-Connection -ComputerName "{{ lab_dc_ip | default('10.10.10.10') }}" -Count 2 -Quiet
      register: dc_ping
      tags: [join]

    - name: Fail if the DC is not reachable
      ansible.builtin.fail:
        msg: "Cannot reach Domain Controller at {{ lab_dc_ip | default('10.10.10.10') }}. Ensure lab-dc01 is running."
      when: dc_ping.stdout | trim | lower == "false"
      tags: [join]

    - name: Join domain lab.local
      ansible.windows.win_domain_membership:
        dns_domain_name: "{{ domain_name | default('lab.local') }}"
        domain_admin_user: "{{ domain_admin }}"
        domain_admin_password: "{{ domain_admin_password | default(hostvars[inventory_hostname]['ansible_password']) }}"
        domain_ou_path: "OU=Servers,DC=lab,DC=local"
        state: domain
      register: domain_join_result
      tags: [join]

    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: domain_join_result.reboot_required | default(false)
      tags: [join]

    # -------------------------------------------------------------------
    # Tag: features — install AD CS role services and management tools
    # -------------------------------------------------------------------
    - name: Install AD CS Certification Authority, Web Enrollment and RSAT
      ansible.windows.win_feature:
        name:
          - ADCS-Cert-Authority
          - ADCS-Web-Enrollment
          - RSAT-ADCS-Mgmt
        include_management_tools: true
        state: present
      register: adcs_features
      tags: [features]

    - name: Show feature installation result
      ansible.builtin.debug:
        msg: "AD CS features installed. Reboot required: {{ adcs_features.reboot_required | default(false) }}"
      tags: [features]

    - name: Reboot if required after feature install
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: adcs_features.reboot_required | default(false)
      tags: [features]

    # -------------------------------------------------------------------
    # Tag: configure — configure the Enterprise Root CA + Web Enrollment
    # -------------------------------------------------------------------
    # Install-AdcsCertificationAuthority is NOT idempotent and throws if a
    # CA already exists, so the win_shell below detects an existing CA via
    # the CertSvc configuration registry key and only configures when absent.
    - name: Check whether a Certification Authority is already configured
      ansible.windows.win_shell: |
        $svc = Get-Service -Name CertSvc -ErrorAction SilentlyContinue
        $reg = "HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration"
        if ($svc -and (Test-Path $reg) -and (Get-ChildItem $reg -ErrorAction SilentlyContinue)) {
            Write-Output "configured"
        } else {
            Write-Output "absent"
        }
      register: ca_state
      changed_when: false
      tags: [configure]

    - name: Configure Enterprise Root CA (4096-bit, SHA256, 10 years)
      ansible.windows.win_shell: |
        Import-Module ADCSDeployment
        Install-AdcsCertificationAuthority `
            -CAType              EnterpriseRootCA `
            -CACommonName        "{{ ca_common_name }}" `
            -KeyLength           4096 `
            -HashAlgorithmName   SHA256 `
            -ValidityPeriod      Years `
            -ValidityPeriodUnits 10 `
            -CryptoProviderName  "RSA#Microsoft Software Key Storage Provider" `
            -Force
      when: ca_state.stdout | trim == "absent"
      register: ca_configure
      tags: [configure]

    # NOTE: For an Enterprise CA the root certificate is published into AD
    # automatically (NTAuth + Certification Authorities containers); domain
    # members receive it in their Trusted Root store via GPO autoenrollment.
    # No manual certutil -dspublish is required.

    - name: Configure AD CS Web Enrollment (/certsrv)
      ansible.windows.win_shell: |
        Import-Module ADCSDeployment
        Install-AdcsWebEnrollment -Force
      register: web_enrollment
      changed_when: "'successfully' in (web_enrollment.stdout | default('') | lower)"
      failed_when: false
      tags: [configure]

    - name: Show CA configuration result
      ansible.builtin.debug:
        msg: >-
          CA state before run: {{ ca_state.stdout | trim }} |
          Configured this run: {{ (ca_state.stdout | trim == 'absent') | ternary('yes', 'no (already present)') }}
      tags: [configure]

    # -------------------------------------------------------------------
    # Tag: validate — verify the CA service responds
    # -------------------------------------------------------------------
    - name: Verify the CA with certutil -ping / -CAInfo
      ansible.windows.win_shell: |
        certutil -ping
        certutil -CAInfo
      register: ca_validate
      changed_when: false
      failed_when: false
      tags: [validate]

    - name: Show CA validation output
      ansible.builtin.debug:
        var: ca_validate.stdout_lines
      tags: [validate]

    # -------------------------------------------------------------------
    # Tag: info — manual certificate-template + auto-enrollment next steps
    # -------------------------------------------------------------------
    - name: Show manual certificate-template and GPO next steps
      ansible.builtin.debug:
        msg:
          - "Enterprise Root CA '{{ ca_common_name }}' is installed on LAB-CA01 (https://lab-ca01.lab.local/certsrv)."
          - "MANUAL STEP 1: certtmpl.msc -> duplicate 'Workstation Authentication' (client auth)"
          - "               and grant Domain Computers Enroll + Autoenroll."
          - "MANUAL STEP 2: certtmpl.msc -> duplicate 'Web Server' as 'ConfigMgr Web Server Certificate'"
          - "               (Subject supplied in request) and grant the SCCM server Enroll."
          - "MANUAL STEP 3: certtmpl.msc -> duplicate 'Workstation Authentication' as"
          - "               'ConfigMgr Client Distribution Point Certificate' (client auth)."
          - "MANUAL STEP 4: certsrv.msc -> Certificate Templates -> New -> Certificate Template to Issue -> select the new templates."
          - "MANUAL STEP 5: GPMC -> create a GPO linked at the domain root; under Computer & User ->"
          - "               Public Key Policies, set 'Certificate Services Client - Auto-Enrollment' = Enabled."
          - "VERIFY: run gpupdate /force on the DCs/clients, then check certlm.msc Personal store."
          - "        DCs auto-enroll a Domain Controller / Kerberos Authentication cert -> enables LDAPS on 636."
          - "        Health: pkiview.msc | certutil -ping | certutil -pingadmin | ldp.exe to <dc>:636."
          - "See infrastructure/vms/ca/README.md for the full guide."
      tags: [info]
