---
# =======================================================================
# Azure AD Connect / Entra Connect Playbook
# =======================================================================
# Configures lab-aadc01 (VM 106, 10.10.10.40) for hybrid Azure AD Join
# using Microsoft Entra Connect (formerly Azure AD Connect).
#
# Prerequisites:
#   - lab-dc01 is running and lab.local is operational
#   - Internet access is available from lab-aadc01 (pfSense/NAT or direct)
#   - Windows Server 2022 is installed on lab-aadc01
#   - WinRM is enabled on lab-aadc01 (run winrm quickconfig -y)
#   - Terraform toggle: enable_aadconnect = true (VM 106)
#   - A valid Azure AD / Entra ID tenant exists
#   - vault_entra_upn_suffix is set in vault.yml (e.g. labdemo.onmicrosoft.com)
#
# Usage:
#   ansible-playbook -i inventory/lab.yml playbooks/aadconnect.yml
#   ansible-playbook -i inventory/lab.yml playbooks/aadconnect.yml --tags rename,network
#   ansible-playbook -i inventory/lab.yml playbooks/aadconnect.yml --tags configure
#
# AUTOMATION PHASES:
#   Phase 1 (fully automated by this playbook):
#     - Rename to LAB-AADC01
#     - Set static IP 10.10.10.40
#     - Install RSAT-AD-PowerShell
#     - Domain join to lab.local
#     - Add routable UPN suffix to the AD forest
#     - Download AzureADConnect.msi to C:\Install\
#
#   Phase 2 (interactive — triggered by this playbook, requires human input):
#     - Launch AzureADConnect.msi installer
#     - Wizard requires a Global Administrator account with MFA
#     - Choose: Custom install, Password Hash Sync, Seamless SSO, Hybrid AADJ
#
#   After the wizard completes, verify with:
#     Get-ADSyncScheduler
#     Start-ADSyncSyncCycle -PolicyType Delta
#
# See infrastructure/vms/aadconnect/README.md for the full guide.
# =======================================================================

- name: Configure Azure AD Connect – lab-aadc01
  hosts: aadconnect
  gather_facts: false

  vars:
    aadc_install_dir: "C:\\Install"
    aadc_msi_path:    "C:\\Install\\AzureADConnect.msi"
    # Microsoft's official download redirect for Entra Connect
    aadc_download_url: "https://go.microsoft.com/fwlink/?LinkId=615771"

  tasks:

    # -------------------------------------------------------------------
    # Connectivity check (always runs regardless of tags)
    # -------------------------------------------------------------------
    - name: Wait for WinRM to be available
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5
      tags: [always]

    - name: Ping Windows host
      ansible.windows.win_ping:
      tags: [always]

    # -------------------------------------------------------------------
    # Tag: info — display current state
    # -------------------------------------------------------------------
    - name: Get current hostname
      ansible.windows.win_shell: $env:COMPUTERNAME
      register: current_hostname
      changed_when: false
      tags: [info]

    - name: Show current hostname
      ansible.builtin.debug:
        msg: "Current hostname: {{ current_hostname.stdout | trim }}"
      tags: [info]

    - name: Get domain membership
      ansible.windows.win_shell: (Get-WmiObject Win32_ComputerSystem).Domain
      register: current_domain
      changed_when: false
      tags: [info]

    - name: Show domain status
      ansible.builtin.debug:
        msg: "Current domain/workgroup: {{ current_domain.stdout | trim }}"
      tags: [info]

    # -------------------------------------------------------------------
    # Tag: rename — rename computer to LAB-AADC01
    # -------------------------------------------------------------------
    - name: Rename computer to LAB-AADC01
      ansible.windows.win_hostname:
        name: LAB-AADC01
      register: rename_result
      when: current_hostname.stdout | trim | upper != "LAB-AADC01"
      tags: [rename]

    - name: Reboot after rename
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: rename_result.reboot_required | default(false)
      tags: [rename]

    - name: Wait for WinRM after rename reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: rename_result.reboot_required | default(false)
      tags: [rename]

    # -------------------------------------------------------------------
    # Tag: network — static IP and internet connectivity check
    # -------------------------------------------------------------------
    - name: Configure static IP address
      ansible.windows.win_shell: |
        $adapter  = Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | Select-Object -First 1
        $desired  = "10.10.10.40"
        $existing = Get-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                    Where-Object { $_.IPAddress -eq $desired }
        if (-not $existing) {
            Remove-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            Remove-NetRoute     -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            New-NetIPAddress -InterfaceAlias $adapter.Name `
                -IPAddress $desired `
                -PrefixLength 24 `
                -DefaultGateway "{{ lab_gateway | default('10.10.10.1') }}" | Out-Null
        }
        Set-DnsClientServerAddress -InterfaceAlias $adapter.Name `
            -ServerAddresses "{{ lab_dns_primary | default('10.10.10.10') }}"
      tags: [network]

    - name: Verify internet connectivity to login.microsoftonline.com
      ansible.windows.win_shell: |
        $result = Test-NetConnection -ComputerName login.microsoftonline.com -Port 443
        $result | Select-Object -ExpandProperty TcpTestSucceeded
      register: internet_check
      changed_when: false
      tags: [network]

    - name: Fail if internet is not reachable
      ansible.builtin.fail:
        msg: >-
          Internet access required for Entra Connect — enable pfSense/NAT gateway first.
          Set enable_pfsense = true in terraform.tfvars and ensure 10.10.10.1 is routing
          traffic to the internet before running this playbook.
      when: internet_check.stdout | trim | lower == "false"
      tags: [network]

    # -------------------------------------------------------------------
    # Tag: features — install RSAT-AD-PowerShell
    # -------------------------------------------------------------------
    - name: Install RSAT-AD-PowerShell
      ansible.windows.win_feature:
        name:
          - RSAT-AD-PowerShell
        include_management_tools: true
        state: present
      register: features_result
      tags: [features]

    - name: Reboot if required after feature install
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: features_result.reboot_required | default(false)
      tags: [features]

    - name: Wait for WinRM after feature reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: features_result.reboot_required | default(false)
      tags: [features]

    # -------------------------------------------------------------------
    # Tag: join — domain-join to lab.local
    # -------------------------------------------------------------------
    - name: Test DC connectivity before domain join
      ansible.windows.win_shell: |
        Test-Connection -ComputerName "{{ lab_dns_primary | default('10.10.10.10') }}" -Count 2 -Quiet
      register: dc_ping
      changed_when: false
      tags: [join]

    - name: Fail if DC is not reachable
      ansible.builtin.fail:
        msg: >-
          Cannot reach Domain Controller at {{ lab_dns_primary | default('10.10.10.10') }}.
          Ensure lab-dc01 is running before domain-joining lab-aadc01.
      when: dc_ping.stdout | trim | lower == "false"
      tags: [join]

    - name: Join domain lab.local (OU=Servers)
      ansible.windows.win_domain_membership:
        dns_domain_name: "{{ lab_domain | default('lab.local') }}"
        domain_admin_user: "{{ domain_join_user }}"
        domain_admin_password: "{{ domain_join_password }}"
        domain_ou_path: "OU=Servers,DC=lab,DC=local"
        state: domain
      register: domain_join_result
      tags: [join]

    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: domain_join_result.reboot_required | default(false)
      tags: [join]

    - name: Wait for WinRM after domain-join reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: domain_join_result.reboot_required | default(false)
      tags: [join]

    # -------------------------------------------------------------------
    # Tag: configure — add UPN suffix, download and launch Entra Connect
    # -------------------------------------------------------------------
    - name: Check if Entra UPN suffix is already present in the AD forest
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $forest = Get-ADForest
        if ($forest.UPNSuffixes -contains "{{ entra_upn_suffix }}") {
            Write-Output "present"
        } else {
            Write-Output "absent"
        }
      register: upn_suffix_check
      changed_when: false
      tags: [configure]

    - name: Add routable UPN suffix to AD forest
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        Set-ADForest -Identity "{{ lab_domain | default('lab.local') }}" `
            -UPNSuffixes @{Add = "{{ entra_upn_suffix }}"}
      when: upn_suffix_check.stdout | trim == "absent"
      tags: [configure]

    - name: Skip message — UPN suffix already present
      ansible.builtin.debug:
        msg: "UPN suffix {{ entra_upn_suffix }} is already present in the AD forest. Skipping."
      when: upn_suffix_check.stdout | trim == "present"
      tags: [configure]

    - name: Create install directory
      ansible.windows.win_file:
        path: "{{ aadc_install_dir }}"
        state: directory
      tags: [configure]

    - name: Check if Entra Connect installer already downloaded
      ansible.windows.win_stat:
        path: "{{ aadc_msi_path }}"
      register: aadc_msi_stat
      tags: [configure]

    - name: Download Entra Connect (AzureADConnect.msi)
      ansible.windows.win_get_url:
        url: "{{ aadc_download_url }}"
        dest: "{{ aadc_msi_path }}"
        timeout: 300
      when: not aadc_msi_stat.stat.exists
      tags: [configure]

    - name: Launch Entra Connect installer (interactive wizard — requires Global Admin + MFA)
      ansible.windows.win_shell: |
        Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i `"{{ aadc_msi_path }}`" /qb" `
            -Wait
      tags: [configure]

    # -------------------------------------------------------------------
    # Tag: info — next steps after interactive wizard
    # -------------------------------------------------------------------
    - name: Show Phase 2 next steps
      ansible.builtin.debug:
        msg:
          - "========================================================="
          - "ENTRA CONNECT — INTERACTIVE WIZARD NEXT STEPS"
          - "========================================================="
          - "The MSI installer was launched on LAB-AADC01."
          - "Complete the wizard using these settings:"
          - ""
          - "  Install type:        Custom"
          - "  Sign-in method:      Password Hash Synchronization (PHS)"
          - "  Optional features:   Enable Seamless Single Sign-On"
          - "  Hybrid AADJ:         Enable Hybrid Azure AD Join"
          - "  Global Admin creds:  Your Azure AD / Entra ID Global Admin"
          - "  Domain/OU filter:    Select lab.local (all OUs or specific)"
          - "  UPN Suffix:          {{ entra_upn_suffix }}"
          - ""
          - "After the wizard completes, verify sync with:"
          - "  Get-ADSyncScheduler"
          - "  Start-ADSyncSyncCycle -PolicyType Delta"
          - ""
          - "Check synced objects in Entra Portal:"
          - "  https://entra.microsoft.com -> Users -> All Users"
          - "  (filter by Sync status = Cloud synced)"
          - ""
          - "For co-management with SCCM, also configure:"
          - "  SCCM Console -> Administration -> Cloud Services -> Co-management"
          - ""
          - "See infrastructure/vms/aadconnect/README.md for the full guide."
          - "========================================================="
      tags: [info, always]
