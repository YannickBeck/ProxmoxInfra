---
# =======================================================================
# Microsoft Entra Cloud Sync Playbook
# =======================================================================
# Configures lab-cloudsync01 (VM 109, 10.10.10.41) as a domain-joined
# member server running the Microsoft Entra provisioning agent (Cloud
# Sync). Cloud Sync is the lightweight, cloud-managed alternative to the
# full Entra Connect sync engine — the agent on this server only relays
# AD objects; the actual synchronisation rules live CLOUD-SIDE in the
# Microsoft Entra admin center.
#
# Prerequisites:
#   - lab-dc01 is running and lab.local is operational
#   - Internet access is available from lab-cloudsync01 (pfSense/OPNsense
#     NAT or direct) — the agent must reach login.microsoftonline.com
#   - Windows Server 2022 is installed on lab-cloudsync01
#   - WinRM is enabled on lab-cloudsync01 (run winrm quickconfig -y)
#   - Terraform toggle: enable_cloudsync = true (VM 109)
#   - A valid Azure AD / Entra ID tenant exists with a Global Admin
#   - Inventory lab.yml has the `cloudsync` group uncommented
#
# Usage:
#   ansible-playbook -i inventory/lab.yml playbooks/cloudsync.yml
#   ansible-playbook -i inventory/lab.yml playbooks/cloudsync.yml --tags rename,network
#   ansible-playbook -i inventory/lab.yml playbooks/cloudsync.yml --tags configure
#
# AUTOMATION PHASES:
#   Phase 1 (fully automated by this playbook):
#     - Rename to LAB-CLOUDSYNC01
#     - Set static IP 10.10.10.41
#     - Install RSAT-AD-PowerShell
#     - Domain join to lab.local
#     - Verify internet connectivity to login.microsoftonline.com
#     - Download the Entra provisioning agent to C:\Install\
#     - Silently install the provisioning agent
#
#   Phase 2 (interactive — CLOUD-SIDE, requires human input):
#     - Register the agent (prompts for a Global Admin during install, or
#       register unattended with the AADCloudSyncTools PowerShell module)
#     - In the Microsoft Entra admin center: create and enable a Cloud Sync
#       configuration mapping the AD OU(s) to Entra, then start provisioning
#
# See infrastructure/entra-cloudsync/README.md for the full guide.
# =======================================================================

- name: Configure Microsoft Entra Cloud Sync – lab-cloudsync01
  hosts: cloudsync
  gather_facts: false

  vars:
    cloudsync_install_dir:  "C:\\Install"
    cloudsync_agent_path:   "C:\\Install\\AADConnectProvisioningAgentSetup.exe"
    # Microsoft's official download redirect for the Entra provisioning agent
    cloudsync_agent_url:    "https://aka.ms/EntraProvisioningAgent"
    # Installed agent service / path used to guard the silent install
    cloudsync_agent_service: "AADConnectProvisioningAgent"
    cloudsync_agent_installed_path: "C:\\Program Files\\Microsoft Azure AD Connect Provisioning Agent"
    # Domain join credentials — resolved from vault via group_vars/all/main.yml
    # domain_join_user     → vault_domain_join_user     (default: LAB\Administrator)
    # domain_join_password → vault_domain_join_password
    # admin_password       → vault_admin_password

  tasks:

    # -------------------------------------------------------------------
    # Connectivity check (always runs regardless of tags)
    # -------------------------------------------------------------------
    - name: Wait for WinRM to be available
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5
      tags: [always]

    - name: Ping Windows host
      ansible.windows.win_ping:
      tags: [always]

    # -------------------------------------------------------------------
    # Tag: info — display current state
    # -------------------------------------------------------------------
    - name: Get current hostname
      ansible.windows.win_shell: $env:COMPUTERNAME
      register: current_hostname
      changed_when: false
      tags: [info]

    - name: Show current hostname
      ansible.builtin.debug:
        msg: "Current hostname: {{ current_hostname.stdout | trim }}"
      tags: [info]

    - name: Get domain membership
      ansible.windows.win_shell: (Get-WmiObject Win32_ComputerSystem).Domain
      register: current_domain
      changed_when: false
      tags: [info]

    - name: Show domain status
      ansible.builtin.debug:
        msg: "Current domain/workgroup: {{ current_domain.stdout | trim }}"
      tags: [info]

    # -------------------------------------------------------------------
    # Tag: rename — rename computer to LAB-CLOUDSYNC01
    # -------------------------------------------------------------------
    - name: Rename computer to LAB-CLOUDSYNC01
      ansible.windows.win_hostname:
        name: LAB-CLOUDSYNC01
      register: rename_result
      when: current_hostname.stdout | trim | upper != "LAB-CLOUDSYNC01"
      tags: [rename]

    - name: Reboot after rename
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: rename_result.reboot_required | default(false)
      tags: [rename]

    - name: Wait for WinRM after rename reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: rename_result.reboot_required | default(false)
      tags: [rename]

    # -------------------------------------------------------------------
    # Tag: network — static IP 10.10.10.41 (guarded, idempotent)
    # -------------------------------------------------------------------
    - name: Configure static IP address
      ansible.windows.win_shell: |
        $adapter  = Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | Select-Object -First 1
        $desired  = "{{ lab_cloudsync_ip | default('10.10.10.41') }}"
        $existing = Get-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                    Where-Object { $_.IPAddress -eq $desired }
        if (-not $existing) {
            Remove-NetIPAddress -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            Remove-NetRoute     -InterfaceAlias $adapter.Name -AddressFamily IPv4 -Confirm:$false -ErrorAction SilentlyContinue
            New-NetIPAddress -InterfaceAlias $adapter.Name `
                -IPAddress $desired `
                -PrefixLength 24 `
                -DefaultGateway "{{ lab_gateway | default('10.10.10.1') }}" | Out-Null
        }
        Set-DnsClientServerAddress -InterfaceAlias $adapter.Name `
            -ServerAddresses "{{ lab_dns_primary | default('10.10.10.10') }}"
      tags: [network]

    # -------------------------------------------------------------------
    # Tag: features — install RSAT-AD-PowerShell
    # -------------------------------------------------------------------
    - name: Install RSAT-AD-PowerShell
      ansible.windows.win_feature:
        name:
          - RSAT-AD-PowerShell
        include_management_tools: true
        state: present
      register: features_result
      tags: [features]

    - name: Reboot if required after feature install
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: features_result.reboot_required | default(false)
      tags: [features]

    - name: Wait for WinRM after feature reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: features_result.reboot_required | default(false)
      tags: [features]

    # -------------------------------------------------------------------
    # Tag: join — domain-join to lab.local (OU=Servers)
    # -------------------------------------------------------------------
    - name: Test DC connectivity before domain join
      ansible.windows.win_shell: |
        Test-Connection -ComputerName "{{ lab_dns_primary | default('10.10.10.10') }}" -Count 2 -Quiet
      register: dc_ping
      changed_when: false
      tags: [join]

    - name: Fail if DC is not reachable
      ansible.builtin.fail:
        msg: >-
          Cannot reach Domain Controller at {{ lab_dns_primary | default('10.10.10.10') }}.
          Ensure lab-dc01 is running before domain-joining lab-cloudsync01.
      when: dc_ping.stdout | trim | lower == "false"
      tags: [join]

    - name: Join domain lab.local (OU=Servers)
      ansible.windows.win_domain_membership:
        dns_domain_name: "{{ lab_domain | default('lab.local') }}"
        domain_admin_user: "{{ domain_join_user }}"
        domain_admin_password: "{{ domain_join_password }}"
        domain_ou_path: "OU=Servers,DC=lab,DC=local"
        state: domain
      register: domain_join_result
      tags: [join]

    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout: 300
        post_reboot_delay: 30
      when: domain_join_result.reboot_required | default(false)
      tags: [join]

    - name: Wait for WinRM after domain-join reboot
      ansible.builtin.wait_for_connection:
        delay: 30
        timeout: 300
        sleep: 10
      when: domain_join_result.reboot_required | default(false)
      tags: [join]

    # -------------------------------------------------------------------
    # Tag: join — internet connectivity check (fails fast with guidance)
    # -------------------------------------------------------------------
    - name: Verify internet connectivity to login.microsoftonline.com
      ansible.windows.win_shell: |
        $result = Test-NetConnection -ComputerName login.microsoftonline.com -Port 443
        $result | Select-Object -ExpandProperty TcpTestSucceeded
      register: internet_check
      changed_when: false
      tags: [join, configure]

    - name: Fail if internet is not reachable
      ansible.builtin.fail:
        msg: >-
          Internet access required for the Entra provisioning agent — enable the
          pfSense/OPNsense NAT gateway first. Set enable_pfsense = true (or
          enable_opnsense = true) in terraform.tfvars and ensure 10.10.10.1 is
          routing traffic to the internet before running this playbook. The agent
          must reach login.microsoftonline.com:443 to register and provision.
      when: internet_check.stdout | trim | lower == "false"
      tags: [join, configure]

    # -------------------------------------------------------------------
    # Tag: configure — download and silently install the provisioning agent
    # -------------------------------------------------------------------
    - name: Create install directory
      ansible.windows.win_file:
        path: "{{ cloudsync_install_dir }}"
        state: directory
      tags: [configure]

    - name: Check if the provisioning agent installer is already downloaded
      ansible.windows.win_stat:
        path: "{{ cloudsync_agent_path }}"
      register: cloudsync_agent_stat
      tags: [configure]

    - name: Download Entra provisioning agent (AADConnectProvisioningAgentSetup.exe)
      ansible.windows.win_get_url:
        url: "{{ cloudsync_agent_url }}"
        dest: "{{ cloudsync_agent_path }}"
        timeout: 300
      when: not cloudsync_agent_stat.stat.exists
      tags: [configure]

    - name: Check whether the provisioning agent is already installed
      ansible.windows.win_shell: |
        $svc = Get-Service -Name "{{ cloudsync_agent_service }}" -ErrorAction SilentlyContinue
        if ($svc -or (Test-Path "{{ cloudsync_agent_installed_path }}")) {
            Write-Output "installed"
        } else {
            Write-Output "absent"
        }
      register: cloudsync_agent_installed
      changed_when: false
      tags: [configure]

    - name: Silently install the Entra provisioning agent
      ansible.windows.win_shell: |
        $proc = Start-Process -FilePath "{{ cloudsync_agent_path }}" `
            -ArgumentList "/quiet" `
            -Wait -PassThru
        exit $proc.ExitCode
      args:
        creates: "{{ cloudsync_agent_installed_path }}"
      when: cloudsync_agent_installed.stdout | trim == "absent"
      register: cloudsync_agent_install
      tags: [configure]

    - name: Show provisioning agent install result
      ansible.builtin.debug:
        msg: >-
          Provisioning agent install:
          {{ (cloudsync_agent_installed.stdout | trim == 'installed') | ternary('already present — skipped', 'installed this run') }}
      tags: [configure]

    # -------------------------------------------------------------------
    # Tag: configure — Phase 2 cloud-side configuration instructions
    # -------------------------------------------------------------------
    - name: Show Phase 2 next steps (Cloud Sync is configured CLOUD-SIDE)
      ansible.builtin.debug:
        msg:
          - "========================================================="
          - "ENTRA CLOUD SYNC — PHASE 2 (CLOUD-SIDE) NEXT STEPS"
          - "========================================================="
          - "The provisioning agent is installed on LAB-CLOUDSYNC01."
          - "Cloud Sync configuration is done CLOUD-SIDE, not on this server."
          - ""
          - "STEP 1 — REGISTER THE AGENT:"
          - "  The agent setup wizard prompts for a Global Administrator to"
          - "  register the agent with your Entra tenant. If the silent (/quiet)"
          - "  install did not register it interactively, register unattended"
          - "  with the AADCloudSyncTools PowerShell module on LAB-CLOUDSYNC01:"
          - "      Install-Module -Name AADCloudSyncTools"
          - "      Import-Module AADCloudSyncTools"
          - "      Connect-AADCloudSyncTools"
          - "      Add-AADCloudSyncToolsServiceAccount"
          - ""
          - "STEP 2 — VERIFY THE AGENT IS HEALTHY:"
          - "  Microsoft Entra admin center -> Identity -> Hybrid management ->"
          - "  Microsoft Entra Connect -> Cloud sync. Confirm the agent for"
          - "  LAB-CLOUDSYNC01 shows status = Healthy / Active."
          - ""
          - "STEP 3 — CREATE A CLOUD SYNC CONFIGURATION:"
          - "  On the same Cloud sync blade choose 'New configuration', select"
          - "  the AD forest (lab.local), and map the AD OU(s) (e.g. OU=Users,"
          - "  DC=lab,DC=local) to Entra via the scoping filters."
          - ""
          - "STEP 4 — ENABLE AND START PROVISIONING:"
          - "  Set the configuration to 'Enabled', save, then 'Start provisioning'."
          - "  Watch the provisioning logs until the first cycle completes and"
          - "  confirm synced users appear in Entra (Identity -> Users)."
          - ""
          - "See infrastructure/entra-cloudsync/README.md for the full guide."
          - "========================================================="
      tags: [configure, info]
