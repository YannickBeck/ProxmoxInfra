---
# =======================================================================
# Role: gitlab — tasks/main.yml
# =======================================================================
# Installs Docker Engine, deploys GitLab CE via Docker Compose.
#
# After this role completes, GitLab takes 5–10 minutes to fully start.
# Get the initial root password:
#   docker exec -it gitlab grep 'Password:' /etc/gitlab/initial_root_password
# =======================================================================

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
      gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create GitLab directory structure
  ansible.builtin.file:
    path: "{{ gitlab_install_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - config
    - logs
    - data

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitlab_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull GitLab Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_install_dir }}"
    pull: always
    state: present

- name: Start GitLab stack
  community.docker.docker_compose_v2:
    project_src: "{{ gitlab_install_dir }}"
    state: present

- name: Wait for GitLab to become healthy (up to 10 minutes)
  community.docker.docker_container_info:
    name: gitlab
  register: gitlab_info
  until: gitlab_info.container.State.Health.Status == "healthy"
  retries: 60
  delay: 10

- name: Display initial root password location
  ansible.builtin.debug:
    msg: >-
      GitLab is up. Get the initial root password with:
      docker exec -it gitlab grep 'Password:' /etc/gitlab/initial_root_password
      (valid for 24 hours)
