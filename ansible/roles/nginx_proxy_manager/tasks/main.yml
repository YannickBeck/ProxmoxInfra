---
# =======================================================================
# Role: nginx_proxy_manager — tasks/main.yml
# =======================================================================
# Installs Docker Engine + Docker Compose plugin, then deploys Nginx
# Proxy Manager (NPM) as a Docker Compose stack.
#
# After this role completes:
#   Admin UI: http://<host>:81
#   Default credentials: admin@example.com / changeme
# =======================================================================

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
      gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create NPM installation directory
  ansible.builtin.file:
    path: "{{ npm_install_dir }}"
    state: directory
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../infrastructure/vms/nginx/docker/docker-compose.yml"
    dest: "{{ npm_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull NPM Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ npm_install_dir }}"
    pull: always
    state: present

- name: Start NPM stack
  community.docker.docker_compose_v2:
    project_src: "{{ npm_install_dir }}"
    state: present
