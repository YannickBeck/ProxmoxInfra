---
# =======================================================================
# Role: paperless — tasks/main.yml
# =======================================================================
# Installs Docker Engine, deploys Paperless-ngx with PostgreSQL + Redis.
#
# After this role completes:
#   Web UI: http://<host>:8000
#   Login with the admin credentials set in defaults/main.yml (or vault).
# =======================================================================

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
      gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create Paperless installation directory
  ansible.builtin.file:
    path: "{{ paperless_install_dir }}"
    state: directory
    mode: "0755"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ paperless_install_dir }}/.env"
    mode: "0600"

- name: Create Paperless data directories
  ansible.builtin.file:
    path: "{{ paperless_install_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - data
    - media
    - consume
    - export

- name: Pull Paperless Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_install_dir }}"
    pull: always
    state: present

- name: Start Paperless stack
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_install_dir }}"
    state: present
